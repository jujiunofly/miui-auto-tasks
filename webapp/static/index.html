<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIUI Auto Tasks</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=23">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">MI</div>
        <div>
          <h1>小米社区自动任务</h1>
          <p id="subtitle">正在连接运行器...</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="settingsBtn" class="btn ghost" type="button">设置</button>
        <span id="statusPill" class="pill idle">待运行</span>
        <button id="runBtn" class="btn primary" type="button">立即运行</button>
      </div>
    </header>

    <main class="grid">
      <section class="card accounts-card">
        <div class="card-head">
          <div>
            <h2>账号与任务</h2>
            <p class="muted">修改任务开关会自动保存到配置文件</p>
          </div>
          <span id="accountCount" class="badge">0 个账号</span>
        </div>
        <div id="accounts" class="accounts"></div>
      </section>

      <section class="card side-card">
        <div class="card-head">
          <div>
            <h2>推送与运行</h2>
            <p class="muted">账号状态与通知配置</p>
          </div>
          <span id="tgBadge" class="badge">检查中</span>
        </div>
        <div id="telegramInfo" class="info-box"></div>
        <div class="run-stats">
          <div>
            <span class="stat-label">上次状态</span>
            <strong id="lastStatus">暂无</strong>
          </div>
          <div>
            <span class="stat-label">开始时间</span>
            <strong id="lastStarted">暂无</strong>
          </div>
          <div>
            <span class="stat-label">结束时间</span>
            <strong id="lastFinished">暂无</strong>
          </div>
        </div>
      </section>

      <section class="card logs-card">
        <div class="card-head log-head">
          <div>
            <h2>脚本日志</h2>
            <p class="muted">日志只在本页显示；Telegram 每次自动发送账号汇总</p>
          </div>
          <div class="log-actions">
            <label class="checkline"><input id="autoScroll" type="checkbox" checked> 自动滚动</label>
          </div>
        </div>

        <div class="log-toolbar">
          <select id="levelFilter" aria-label="日志级别">
            <option value="ALL">全部级别</option>
            <option value="INFO">INFO</option>
            <option value="SUCCESS">SUCCESS</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>

        <div class="log-table-head">
          <span>时间</span>
          <span>级别</span>
          <span>内容</span>
        </div>
        <div id="logList" class="log-list"></div>
        <div id="logEmpty" class="empty">暂无日志，点击右上角“立即运行”开始。</div>
      </section>
    </main>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card settings-card">
      <div class="modal-head">
        <div>
          <span class="eyebrow">配置</span>
          <h2>设置</h2>
        </div>
        <button id="settingsClose" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <p class="muted">敏感字段留空表示保持现有值。Cookie 请粘贴完整的 <code>key=value; key2=value2</code> 字符串。</p>
      <div id="settingsContent" class="settings-content"></div>
      <div class="modal-actions">
        <button id="settingsCancel" class="btn ghost" type="button">取消</button>
        <button id="settingsSave" class="btn primary" type="button">保存设置</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js?v=23"></script>
</body>
</html>
